<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>飞行工具合集</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            padding: 16px;
            overflow-x: hidden;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #1a3a5c;
            font-size: 22px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e8eef3;
        }
        /* tab选项卡 */
        .tabs {
            display: flex;
            gap:8px;
            margin-bottom:24px;
            border-bottom:1px solid #e2e8f0;
            flex-wrap: wrap;
        }
        .tab-item {
            padding:12px 14px;
            cursor:pointer;
            border:none;
            background:#f1f5f9;
            border-radius:8px 8px 0 0;
            font-size:14px;
            color:#475569;
            min-height:44px;
            flex:1;
            min-width:120px;
        }
        .tab-item.active {
            background:#1a3a5c;
            color:#fff;
        }
        .tab-panel {
            display:none;
        }
        .tab-panel.active {
            display:block;
        }
        /* === 起落统计样式 === */
        .stats-overview {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            flex: 1;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .stat-card .label {
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
        }
        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            color: #1a3a5c;
        }
        .form-group {
            display: flex;
            align-items: flex-start;
            margin-bottom: 14px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .form-group label {
            font-size: 14px;
            color: #333;
            font-weight: 500;
            min-width: 80px;
            padding-top:8px;
        }
        /* 统一所有输入框样式，包含date/time/number/text */
        .form-group input[type="date"],
        .form-group input[type="time"],
        .form-group input[type="number"],
        .form-group input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            background: #fafbfc;
            min-width: 150px;
            min-height:44px;
        }
        .form-group input:focus {
            border-color: #2c5364;
            background: #fff;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            min-height:44px;
        }
        .btn-primary {
            background: #1a3a5c;
            color: #fff;
            flex: 1;
        }
        .btn-primary:hover {
            background: #2c5364;
        }
        .btn-secondary {
            background: #e8eef3;
            color: #1a3a5c;
        }
        .btn-secondary:hover {
            background: #d0d7de;
        }
        .btn-danger {
            background: #fee2e2;
            color: #dc2626;
        }
        .btn-danger:hover {
            background: #fecaca;
        }
        .data-section {
            margin-top: 28px;
        }
        .data-section h2 {
            font-size: 16px;
            color: #1a3a5c;
            margin-bottom: 12px;
            padding-left: 10px;
            border-left: 3px solid #2c5364;
        }
        .record-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }
        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            border-bottom: 1px solid #f0f2f5;
            font-size: 14px;
            min-height:48px;
            gap:12px;
        }
        .record-item:last-child {
            border-bottom: none;
        }
        .record-item .date {
            color: #333;
        }
        .record-item .count {
            color: #1a3a5c;
            font-weight: 600;
            margin-right:auto;
        }
        /* 美化删除按钮 */
        .record-item .del-btn {
            background-color: #ef4444;
            color:#ffffff;
            border: none;
            cursor: pointer;
            font-size:13px;
            padding:6px 12px;
            border-radius:6px;
            min-height:34px;
            transition: background 0.2s;
            flex-shrink:0;
        }
        .record-item .del-btn:hover {
            background-color:#dc2626;
        }
        .record-item .del-btn:active{
            background-color:#b91c1c;
        }
        .empty-tip {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 14px;
        }
        .sync-section {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #e8eef3;
        }
        .sync-section h2 {
            font-size: 16px;
            color: #1a3a5c;
            margin-bottom: 12px;
            padding-left: 10px;
            border-left: 3px solid #2c5364;
        }
        .sync-tip {
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
            line-height: 1.6;
        }
        .sync-btns {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items:center;
        }
        /* 修复移动端file输入框：不用display:none，用视觉隐藏 */
        .file-wrap{
            position:relative;
        }
        .real-file-input{
            position:absolute;
            opacity:0;
            width:100%;
            height:100%;
            top:0;
            left:0;
            z-index:10;
            cursor:pointer;
        }
        .hidden-input {
            display: none;
        }
        /* === 飞行短信生成样式 === */
        .form-group label.fs-label {
            width: 130px;
            font-size: 14px;
            color: #333;
            font-weight: 500;
            flex-shrink: 0;
            min-width:auto;
            padding-top:8px;
        }
        .input-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex-wrap:nowrap;
        }
        .form-group select {
            padding: 10px 12px;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            background: #fafbfc;
            min-height:44px;
            min-width:0;
        }
        /* 称呼下拉框：限制最大宽度，保证选项文字完整显示 */
        #title {
            flex: 0 0 100px;
            width: 100px;
            max-width:100px;
        }
        /* 类别下拉框：缩短宽度，不再撑满整行 */
        #level {
            flex: 0 0 110px;
            width:110px;
            max-width:110px;
        }
        .custom-input {
            display: none;
            flex:1;
            min-width:0;
        }
        .suffix {
            font-size: 13px;
            color: #666;
            white-space: nowrap;
            flex-shrink:0;
        }
        .prefix {
            font-size: 13px;
            color: #666;
            white-space: nowrap;
            flex-shrink:0;
        }
        .result-area {
            margin-top: 24px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            display: none;
        }
        .result-area textarea {
            width: 100%;
            min-height: 320px;
            border: none;
            background: transparent;
            font-size: 15px;
            line-height: 1.8;
            resize: vertical;
            outline: none;
            color: #333;
            font-family: inherit;
        }
        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #1a3a5c;
            margin: 20px 0 12px;
            padding-left: 10px;
            border-left: 3px solid #2c5364;
        }
        .section-title:first-of-type {
            margin-top: 0;
        }
        .inline-group {
            display: flex;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }
        .inline-group select,
        .inline-group input {
            flex: 1;
            min-width:0;
        }
        .btn-copy {
            background: #e8eef3;
            color: #1a3a5c;
        }
        .btn-copy:hover {
            background: #d0d7de;
        }

        @media (max-width: 600px) {
            body{padding:12px;}
            .container { padding: 18px 14px; }
            h1{font-size:20px;}
            .stats-overview { flex-direction: column; }
            .form-group{align-items:flex-start;}
            .form-group label.fs-label {
                width: 100%;
                font-size: 13px;
                padding-top:0;
                margin-bottom:4px;
            }
            .input-wrap {
                min-width: 100%;
            }
            /*手机端缩小称呼、类别下拉框尺寸 */
            #title {
                flex:0 0 90px;
                width:90px;
                max-width:90px;
            }
            #level {
                flex:0 0 100px;
                width:100px;
                max-width:100px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>✈️ 飞行工具合集</h1>
    <!-- 选项卡 -->
    <div class="tabs">
        <button class="tab-item active" data-tab="tab-qiluo">起落数据统计</button>
        <button class="tab-item" data-tab="tab-sms">飞行前短信生成</button>
    </div>
    <!-- tab1 起落数据统计 -->
    <div class="tab-panel active" id="tab-qiluo">
        <div class="stats-overview">
            <div class="stat-card">
                <div class="label">起落总数</div>
                <div class="value" id="totalCount">0</div>
            </div>
            <div class="stat-card">
                <div class="label">近一个月起落</div>
                <div class="value" id="monthCount">0</div>
            </div>
        </div>
        <div class="form-group">
            <label>日期</label>
            <input type="date" id="recordDate">
        </div>
        <div class="form-group">
            <label>起落次数</label>
            <input type="number" id="recordCount" placeholder="请输入起落次数" min="0">
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="addRecord()">添加记录</button>
        </div>
        <div class="data-section">
            <h2>📋 记录列表</h2>
            <div class="record-list" id="recordList">
                <div class="empty-tip">暂无记录</div>
            </div>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="clearAll()">清空所有记录</button>
            </div>
        </div>
        <div class="sync-section">
            <h2>🔄 数据同步</h2>
            <p class="sync-tip">导出仅包含起落记录；类别、小时、讲评、所属单位、姓名等配置保存在浏览器本地，不会随JSON导出。</p>
            <div class="sync-btns">
                <button class="btn btn-secondary" onclick="exportData()">📤 导出数据</button>
                <div class="file-wrap">
                    <label class="btn btn-secondary" for="importFile">📥 导入数据</label>
                    <input type="file" id="importFile" class="real-file-input" accept=".json" onchange="importData(event)">
                </div>
            </div>
        </div>
    </div>
    <!-- tab2 飞行前短信 -->
    <div class="tab-panel" id="tab-sms">
        <div class="section-title">基本信息</div>
        <div class="form-group">
            <label class="fs-label">称呼</label>
            <div class="input-wrap">
                <select id="title" onchange="toggleCustomTitle()">
                    <option value="机长">机长</option>
                    <option value="教员">教员</option>
                    <option value="其他">其他</option>
                </select>
                <input type="text" id="customTitle" class="custom-input">
            </div>
        </div>
        <div class="form-group">
            <label class="fs-label">所属单位</label>
            <div class="input-wrap">
                <input type="text" id="unit" placeholder="例如：二大队四中队">
            </div>
        </div>
        <div class="form-group">
            <label class="fs-label">类别</label>
            <div class="input-wrap">
                <select id="level">
                    <option value="FL">FL</option>
                    <option value="FA">FA</option>
                    <option value="FA*">FA*</option>
                    <option value="FB">FB</option>
                    <option value="FB*">FB*</option>
                    <option value="FC">FC</option>
                    <option value="FD">FD</option>
                    <option value="FE">FE</option>
                </select>
            </div>
        </div>
        <!-- 姓名移到类别后面 -->
        <div class="form-group">
            <label class="fs-label">姓名</label>
            <div class="input-wrap">
                <input type="text" id="userName">
            </div>
        </div>
        <div class="form-group">
            <label class="fs-label">飞行经历小时</label>
            <div class="input-wrap">
                <input type="number" id="hours" placeholder="请输入小时数" min="0">
                <span class="suffix">小时</span>
            </div>
        </div>
        <div class="form-group">
            <label class="fs-label">总把杆次数</label>
            <div class="input-wrap">
                <input type="number" id="totalControl" placeholder="自动读取起落统计" min="0">
                <span class="suffix">次</span>
            </div>
        </div>
        <div class="form-group">
            <label class="fs-label">近一个月把杆次数</label>
            <div class="input-wrap">
                <input type="number" id="monthControl" placeholder="自动读取起落统计" min="0">
                <span class="suffix">次</span>
            </div>
        </div>
        <div class="section-title">飞行计划</div>
        <div class="form-group">
            <label class="fs-label">明天的飞行计划</label>
            <div class="input-wrap">
                <input type="text" id="plan" placeholder="请输入飞行计划">
            </div>
        </div>
        <div class="form-group">
            <label class="fs-label">航班号</label>
            <div class="input-wrap">
                <span class="prefix">3U</span>
                <input type="text" id="flightNo" placeholder="请输入航班号">
            </div>
        </div>
        <div class="form-group">
            <label class="fs-label">起飞时间</label>
            <div class="input-wrap">
                <input type="time" id="depTime">
            </div>
        </div>
        <div class="form-group">
            <label class="fs-label">预计到准备室时间</label>
            <div class="input-wrap">
                <input type="time" id="readyTime">
            </div>
        </div>
        <div class="form-group">
            <label class="fs-label">机型/机号</label>
            <div class="input-wrap">
                <select id="aircraftType" style="flex: 0 0 100px; min-width:0;">
                    <option value="A319">A319</option>
                    <option value="A320">A320</option>
                    <option value="A321">A321</option>
                </select>
                <span class="prefix">/B‑</span>
                <input type="text" id="aircraftNo" placeholder="4位数字" maxlength="4" pattern="[0‑9]{4}">
            </div>
        </div>
        <div class="section-title">通告与风险</div>
        <div class="form-group">
            <label class="fs-label">航行通告</label>
            <div class="input-wrap">
                <input type="text" id="notam" placeholder="请输入航行通告内容">
            </div>
        </div>
        <div class="form-group">
            <label class="fs-label">风险提示单主要内容</label>
            <div class="input-wrap">
                <input type="text" id="risk" placeholder="请输入风险提示内容">
            </div>
        </div>
        <div class="section-title">近期情况</div>
        <div class="form-group">
            <label class="fs-label">近期讲评的主要问题</label>
            <div class="input-wrap">
                <input type="text" id="review" placeholder="请输入讲评问题">
            </div>
        </div>
        <div class="form-group">
            <label class="fs-label">半年内三级事件</label>
            <div class="input-wrap">
                <input type="text" id="event" placeholder="请输入三级事件">
            </div>
        </div>
        <div class="btn-group" style="justify-content:center">
            <button class="btn btn-primary" onclick="generate()">生成短信</button>
            <button class="btn btn-copy" onclick="copyText()" id="copyBtn" style="display:none;">一键复制内容</button>
        </div>
        <div class="result-area" id="resultArea">
            <textarea id="resultText" readonly></textarea>
        </div>
    </div>
</div>
<script>
// ========== 常量定义 ==========
const STORAGE_KEY = 'qiluo_records';
const SMS_SAVE_KEY = 'sms_persist_data';

// 读取短信持久化数据
function getSmsPersist(){
    const raw = localStorage.getItem(SMS_SAVE_KEY);
    return raw ? JSON.parse(raw) : { userName:"", unit:"", hours:"", review:"", level:"" };
}
// 保存短信持久化数据
function saveSmsPersist(){
    const obj = {
        userName: document.getElementById('userName').value,
        unit: document.getElementById('unit').value,
        hours: document.getElementById('hours').value,
        review: document.getElementById('review').value,
        level: document.getElementById('level').value
    };
    localStorage.setItem(SMS_SAVE_KEY, JSON.stringify(obj));
}
// 回填持久化字段
function fillSmsPersist(){
    const d = getSmsPersist();
    document.getElementById('userName').value = d.userName;
    document.getElementById('unit').value = d.unit;
    document.getElementById('hours').value = d.hours;
    document.getElementById('review').value = d.review;
    if(d.level) document.getElementById('level').value = d.level;
}

// 自动填充把杆次数函数：读取起落统计localStorage数据填入短信表单
function fillControlData(){
    const records = getRecords();
    const total = records.reduce((sum, r) => sum + r.count, 0);
    const monthAgo = getMonthAgo();
    const monthTotal = records.filter(r => new Date(r.date) >= monthAgo).reduce((sum, r)=> sum + r.count,0);

    document.getElementById('totalControl').value = total;
    document.getElementById('monthControl').value = monthTotal;
}

// tab切换逻辑
const tabBtns = document.querySelectorAll('.tab-item');
tabBtns.forEach(btn=>{
    btn.addEventListener('click',()=>{
        const tabId = btn.dataset.tab;
        //清除active
        tabBtns.forEach(b=>b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(tabId).classList.add('active');
        //切换到短信tab：填充把杆 + 回填姓名、单位、小时、讲评、类别
        if(tabId === 'tab-sms'){
            fillControlData();
            fillSmsPersist();
        }
    })
})

// 失去焦点/切换自动保存持久化字段
document.getElementById('userName').addEventListener('blur', saveSmsPersist);
document.getElementById('unit').addEventListener('blur', saveSmsPersist);
document.getElementById('hours').addEventListener('blur', saveSmsPersist);
document.getElementById('review').addEventListener('blur', saveSmsPersist);
document.getElementById('level').addEventListener('change', saveSmsPersist);

// ========== 起落数据统计逻辑 ==========
function getRecords() {
    const data = localStorage.getItem(STORAGE_KEY);
    return data ? JSON.parse(data) : [];
}
function saveRecords(records) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}
function getMonthAgo() {
    const now = new Date();
    return new Date(now.getFullYear(), now.getMonth() - 1, now.getDate());
}
function updateStats() {
    const records = getRecords();
    const total = records.reduce((sum, r) => sum + r.count, 0);
    document.getElementById('totalCount').textContent = total;
    const monthAgo = getMonthAgo();
    const monthTotal = records
        .filter(r => new Date(r.date) >= monthAgo)
        .reduce((sum, r) => sum + r.count, 0);
    document.getElementById('monthCount').textContent = monthTotal;
}
function renderList() {
    const records = getRecords();
    const list = document.getElementById('recordList');
    if (records.length === 0) {
        list.innerHTML = '<div class="empty-tip">暂无记录</div>';
        return;
    }
    const sorted = [...records].sort((a, b) => new Date(b.date) - new Date(a.date));
    list.innerHTML = sorted.map((r, i) => `
                <div class="record-item">
                    <span class="date">${r.date}</span>
                    <span class="count">${r.count} 次</span>
                    <button class="del-btn" onclick="deleteRecord('${r.date}')">删除</button>
                </div>
            `).join('');
}
function addRecord() {
    const date = document.getElementById('recordDate').value;
    const count = parseInt(document.getElementById('recordCount').value);
    if (!date) {
        alert('请选择日期');
        return;
    }
    if (isNaN(count) || count < 0) {
        alert('请输入有效的起落次数');
        return;
    }
    const records = getRecords();
    const existing = records.find(r => r.date === date);
    if (existing) {
        existing.count += count;
    } else {
        records.push({ date, count });
    }
    saveRecords(records);
    document.getElementById('recordCount').value = '';
    updateStats();
    renderList();
}
function deleteRecord(date) {
    let records = getRecords();
    records = records.filter(r => r.date !== date);
    saveRecords(records);
    updateStats();
    renderList();
}
function clearAll() {
    if (!confirm('确定要清空所有记录吗？此操作不可恢复！')) return;
    saveRecords([]);
    updateStats();
    renderList();
}
function exportData() {
    const records = getRecords();
    // 直接导出纯起落记录数组，不再附带config
    const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `起落数据统计_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
}

//导入逻辑
function importData(event) {
    const files = event.target.files;
    if (!files || files.length === 0) return;
    const file = files[0];
    const reader = new FileReader();

    reader.onerror = function(){
        alert('读取文件失败，请检查文件');
        event.target.value = '';
    };

    reader.onload = function(e) {
        try {
            let data = JSON.parse(e.target.result);
            //兼容旧格式：如果是带records的对象，提取records数组
            if(data && Array.isArray(data.records)){
                data = data.records;
            }
            if(!Array.isArray(data)){
                throw new Error('不是起落记录数组');
            }
            const valid = data.every(r => r.date && typeof r.count === 'number');
            if (!valid) throw new Error('格式错误');
            if (!confirm(`将导入 ${data.length} 条起落记录，是否覆盖当前记录？`)) {
                event.target.value = '';
                return;
            }
            saveRecords(data);
            updateStats();
            renderList();
            alert('导入成功！起落记录已恢复');
        } catch (err) {
            alert('导入失败：文件格式不正确');
        }
        event.target.value = '';
    };
    reader.readAsText(file);
}

// ==========飞行短信生成逻辑==========
function toggleCustomTitle() {
    const select = document.getElementById('title').value;
    const customTitle = document.getElementById('customTitle');
    if (select === '其他') {
        customTitle.style.display = 'block';
    } else {
        customTitle.style.display = 'none';
        customTitle.value = '';
    }
}
function generate() {
    const titleSelect = document.getElementById('title').value;
    const customTitle = document.getElementById('customTitle').value;
    const title = titleSelect === '其他' ? customTitle : titleSelect;
    const userName = document.getElementById('userName').value;
    const unit = document.getElementById('unit').value;
    const level = document.getElementById('level').value;
    const hours = document.getElementById('hours').value;
    const totalControl = document.getElementById('totalControl').value;
    const monthControl = document.getElementById('monthControl').value;
    const plan = document.getElementById('plan').value;
    const flightNo = document.getElementById('flightNo').value;
    const depTime = document.getElementById('depTime').value;
    const readyTime = document.getElementById('readyTime').value;
    const aircraftType = document.getElementById('aircraftType').value;
    const aircraftNo = document.getElementById('aircraftNo').value;
    const notam = document.getElementById('notam').value;
    const risk = document.getElementById('risk').value;
    const review = document.getElementById('review').value;
    const event = document.getElementById('event').value;
    const notamText = notam ? `航行通告：${notam}\n` : '';
    const riskText = risk ? `风险提示单主要内容：${risk}\n` : '';
    const reviewText = review ? `近期讲评的主要问题：${review}\n` : '';
    const eventText = event || '无';
    const text = `尊敬的${title}您好，我是${unit}${level}类副驾驶${userName}，很荣幸跟您飞行！
飞行经历小时：${hours}小时
总把杆次数：${totalControl}次
近一个月把杆次数：${monthControl}次
明天的飞行计划：${plan}
航班号：3U${flightNo}
起飞时间：${depTime}
预计到准备室时间：${readyTime}
机型/机号：${aircraftType}/B‑${aircraftNo}
${notamText}${riskText}${reviewText}半年内三级事件：${eventText}
已完成了网上准备，有很多需要学习的地方，请您多多指教！祝您飞行愉快！谢谢您！
麻烦再问一下，您看明天我们着装是什么要求？`;
    document.getElementById('resultText').value = text;
    document.getElementById('resultArea').style.display = 'block';
    document.getElementById('copyBtn').style.display = 'inline-block';
}
// 新版复制：使用现代Clipboard API，兼容手机浏览器
async function copyText() {
    const text = document.getElementById('resultText').value;
    const btn = document.getElementById('copyBtn');
    try {
        await navigator.clipboard.writeText(text);
        btn.textContent = '✅ 已复制';
    } catch (err) {
        //降级兼容老浏览器
        document.getElementById('resultText').select();
        document.getElementById('resultText').setSelectionRange(0, 99999);
        document.execCommand('copy');
        btn.textContent = '✅ 已复制';
    }
    setTimeout(() => { btn.textContent = '一键复制内容'; }, 2000);
}
//页面初始化
updateStats();
renderList();
