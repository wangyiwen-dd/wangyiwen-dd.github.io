<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞行前短信</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #1a3a5c;
            font-size: 24px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e8eef3;
        }
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .form-group label {
            width: 130px;
            font-size: 14px;
            color: #333;
            font-weight: 500;
            flex-shrink: 0;
        }
        .form-group .input-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 200px;
        }
        .form-group select,
        .form-group input[type="text"],
        .form-group input[type="number"] {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            background: #fafbfc;
        }
        .form-group select:focus,
        .form-group input:focus {
            border-color: #2c5364;
            background: #fff;
        }
        .form-group .suffix {
            font-size: 13px;
            color: #666;
            white-space: nowrap;
        }
        .form-group .prefix {
            font-size: 13px;
            color: #666;
            white-space: nowrap;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: center;
        }
        .btn {
            padding: 10px 32px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .btn-primary {
            background: #1a3a5c;
            color: #fff;
        }
        .btn-primary:hover {
            background: #2c5364;
        }
        .btn-copy {
            background: #e8eef3;
            color: #1a3a5c;
        }
        .btn-copy:hover {
            background: #d0d7de;
        }
        .result-area {
            margin-top: 24px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            display: none;
        }
        .result-area textarea {
            width: 100%;
            min-height: 320px;
            border: none;
            background: transparent;
            font-size: 14px;
            line-height: 1.8;
            resize: vertical;
            outline: none;
            color: #333;
            font-family: inherit;
        }
        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #1a3a5c;
            margin: 20px 0 12px;
            padding-left: 10px;
            border-left: 3px solid #2c5364;
        }
        .section-title:first-of-type {
            margin-top: 0;
        }
        .inline-group {
            display: flex;
            gap: 10px;
            flex: 1;
            min-width: 200px;
        }
        .inline-group select,
        .inline-group input {
            flex: 1;
        }
        #title {
            flex: 0 0 80px;
            width: 80px;
        }
        .custom-input {
            display: none;
            flex: 1;
        }
        @media (max-width: 600px) {
            .container { padding: 20px 16px; }
            .form-group label { width: 110px; font-size: 13px; }
            .form-group .input-wrap { min-width: 160px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✈️ 飞行前短信</h1>

        <div class="section-title">基本信息</div>
        <div class="form-group">
            <label>称呼</label>
            <div class="input-wrap">
                <select id="title" onchange="toggleCustomTitle()">
                    <option value="机长">机长</option>
                    <option value="教员">教员</option>
                    <option value="其他">其他</option>
                </select>
                <input type="text" id="customTitle" class="custom-input" placeholder="请输入称呼">
            </div>
        </div>
        <div class="form-group">
            <label>类别</label>
            <div class="input-wrap">
                <select id="level">
                    <option value="FL">FL</option>
                    <option value="FA">FA</option>
                    <option value="FA*">FA*</option>
                    <option value="FB">FB</option>
                    <option value="FB*">FB*</option>
                    <option value="FC">FC</option>
                    <option value="FD">FD</option>
                    <option value="FE">FE</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>飞行经历小时</label>
            <div class="input-wrap">
                <input type="number" id="hours" placeholder="请输入小时数" min="0">
                <span class="suffix">小时</span>
            </div>
        </div>
        <div class="form-group">
            <label>总把杆次数</label>
            <div class="input-wrap">
                <input type="number" id="totalControl" placeholder="请输入次数" min="0">
                <span class="suffix">次</span>
            </div>
        </div>
        <div class="form-group">
            <label>近一个月把杆次数</label>
            <div class="input-wrap">
                <input type="number" id="monthControl" placeholder="请输入次数" min="0">
                <span class="suffix">次</span>
            </div>
        </div>

        <div class="section-title">飞行计划</div>
        <div class="form-group">
            <label>明天的飞行计划</label>
            <div class="input-wrap">
                <input type="text" id="plan" placeholder="请输入飞行计划">
            </div>
        </div>
        <div class="form-group">
            <label>航班号</label>
            <div class="input-wrap">
                <span class="prefix">3U</span>
                <input type="text" id="flightNo" placeholder="请输入航班号">
            </div>
        </div>
        <div class="form-group">
            <label>起飞时间</label>
            <div class="input-wrap">
                <input type="time" id="depTime">
            </div>
        </div>
        <div class="form-group">
            <label>预计到准备室时间</label>
            <div class="input-wrap">
                <input type="time" id="readyTime">
            </div>
        </div>
        <div class="form-group">
            <label>机型/机号</label>
            <div class="input-wrap">
                <select id="aircraftType" style="flex: 0 0 100px;">
                    <option value="A319">A319</option>
                    <option value="A320">A320</option>
                    <option value="A321">A321</option>
                </select>
                <span class="prefix">/B-</span>
                <input type="text" id="aircraftNo" placeholder="4位数字" maxlength="4" pattern="[0-9]{4}">
            </div>
        </div>

        <div class="section-title">通告与风险</div>
        <div class="form-group">
            <label>航行通告</label>
            <div class="input-wrap">
                <input type="text" id="notam" placeholder="请输入航行通告内容">
            </div>
        </div>
        <div class="form-group">
            <label>风险提示单主要内容</label>
            <div class="input-wrap">
                <input type="text" id="risk" placeholder="请输入风险提示内容">
            </div>
        </div>

        <div class="section-title">近期情况</div>
        <div class="form-group">
            <label>近期讲评的主要问题</label>
            <div class="input-wrap">
                <input type="text" id="review" placeholder="请输入讲评问题">
            </div>
        </div>
        <div class="form-group">
            <label>半年内三级事件</label>
            <div class="input-wrap">
                <input type="text" id="event" placeholder="请输入三级事件">
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="generate()">生成短信</button>
            <button class="btn btn-copy" onclick="copyText()" id="copyBtn" style="display:none;">复制内容</button>
        </div>

        <div class="result-area" id="resultArea">
            <textarea id="resultText" readonly></textarea>
        </div>
    </div>

    <script>
        function toggleCustomTitle() {
            const select = document.getElementById('title');
            const customInput = document.getElementById('customTitle');
            if (select.value === '其他') {
                customInput.style.display = 'block';
            } else {
                customInput.style.display = 'none';
                customInput.value = '';
            }
        }

        function generate() {
            const titleSelect = document.getElementById('title').value;
            const customTitle = document.getElementById('customTitle').value;
            const title = titleSelect === '其他' ? customTitle : titleSelect;
            const level = document.getElementById('level').value;
            const hours = document.getElementById('hours').value;
            const totalControl = document.getElementById('totalControl').value;
            const monthControl = document.getElementById('monthControl').value;
            const plan = document.getElementById('plan').value;
            const flightNo = document.getElementById('flightNo').value;
            const depTime = document.getElementById('depTime').value;
            const readyTime = document.getElementById('readyTime').value;
            const aircraftType = document.getElementById('aircraftType').value;
            const aircraftNo = document.getElementById('aircraftNo').value;
            const notam = document.getElementById('notam').value;
            const risk = document.getElementById('risk').value;
            const review = document.getElementById('review').value;
            const event = document.getElementById('event').value;

            const notamText = notam ? `航行通告：${notam}\n` : '';
            const riskText = risk ? `风险提示单主要内容：${risk}\n` : '';
            const reviewText = review ? `近期讲评的主要问题：${review}\n` : '';
            const eventText = event || '无';

            const text = `${title}您好，我是二大队四中队${level}类副驾驶王翊文，很荣幸跟您飞行！
飞行经历小时：${hours}小时
总把杆次数：${totalControl}次
近一个月把杆次数：${monthControl}次
明天的飞行计划：${plan}
航班号：3U${flightNo}
起飞时间：${depTime}
预计到准备室时间：${readyTime}
机型/机号：${aircraftType}/B-${aircraftNo}
${notamText}${riskText}${reviewText}半年内三级事件：${eventText}
已完成了网上准备，有很多需要学习的地方，请您多多指教！祝您飞行愉快！谢谢您！
麻烦再问一下，您看明天我们着装是什么要求？`;

            document.getElementById('resultText').value = text;
            document.getElementById('resultArea').style.display = 'block';
            document.getElementById('copyBtn').style.display = 'inline-block';
        }

        function copyText() {
            const text = document.getElementById('resultText');
            text.select();
            text.setSelectionRange(0, 99999);
            document.execCommand('copy');
            const btn = document.getElementById('copyBtn');
            btn.textContent = '已复制 ✓';
            setTimeout(() => { btn.textContent = '复制内容'; }, 2000);
        }
    </script>
</body>
</html>
